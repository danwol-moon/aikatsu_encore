<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd1de">
<title>아이카츠 앙코르</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=coordinate-mode-20261010">
</head>
<body>
<div class="wrap">
  <header class="cover">
    <h1>아이카츠 앙코르</h1>
    <p class="sub">aikatsu encore</p>
  </header>
  <div class="view-tabs" role="tablist" aria-label="페이지 선택">
    <button id="cardListTab" class="view-tab active" type="button" role="tab" aria-selected="true">카드 목록</button>
    <button id="coordinateTab" class="view-tab" type="button" role="tab" aria-selected="false">코디네이트</button>
  </div>
  <nav id="controls" class="controls" aria-label="카드 검색 및 필터">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" type="search" placeholder="ID / 이름 / 카테고리 검색" autocomplete="off">
    </div>
    <div class="filters">
      <select id="season"><option value="">탄 전체</option></select>
      <select id="category"><option value="">카테고리 전체</option></select>
      <select id="grade"><option value="">등급 전체</option></select>
      <select id="type"><option value="">타입 전체</option></select>
    </div>
    <div class="collection-tools">
      <div id="collectionCount" class="collection-count">보유 카드 0장 · 전체 0장</div>
      <div class="collection-filter-buttons">
        <button id="wishlistOnly" type="button" aria-pressed="false">♡ 위시리스트만 보기</button>
        <button id="ownedOnly" type="button" aria-pressed="false">보유 중인 카드</button>
        <button id="unownedOnly" type="button" aria-pressed="false">미보유 중인 카드</button>
      </div>
    </div>
  </nav>
  <section id="coordinateView" class="coordinate-view" hidden aria-label="코디네이트 조합">
    <div class="coordinate-heading">
      <h2>코디네이트</h2>
      <p>상의, 하의, 슈즈, 액세서리를 골라 나만의 코디를 조합해 보세요.</p>
    </div>
    <div class="coordinate-slots">
      <article class="coordinate-slot">
        <label for="coordinateTop">상의</label>
        <select id="coordinateTop"><option value="">상의 선택</option></select>
        <div id="coordinateTopPreview" class="coordinate-preview empty">상의 카드를 선택해 주세요</div>
      </article>
      <article class="coordinate-slot">
        <label for="coordinateBottom">하의</label>
        <select id="coordinateBottom"><option value="">하의 선택</option></select>
        <div id="coordinateBottomPreview" class="coordinate-preview empty">하의 카드를 선택해 주세요</div>
      </article>
      <article class="coordinate-slot">
        <label for="coordinateShoes">슈즈</label>
        <select id="coordinateShoes"><option value="">슈즈 선택</option></select>
        <div id="coordinateShoesPreview" class="coordinate-preview empty">슈즈 카드를 선택해 주세요</div>
      </article>
      <article class="coordinate-slot">
        <label for="coordinateAccessory">액세서리</label>
        <select id="coordinateAccessory"><option value="">액세서리 선택</option></select>
        <div id="coordinateAccessoryPreview" class="coordinate-preview empty">액세서리 카드를 선택해 주세요</div>
      </article>
    </div>
  </section>
  <main id="mainContent">
    <div id="loading">카드를 불러오는 중...</div>
    <div id="error" hidden></div>
    <section id="grid" class="card-grid" aria-live="polite"></section>
    <div class="book-pager" aria-label="모바일 카드 페이지 이동">
      <button id="pagePrev" type="button" aria-label="이전 페이지">‹</button>
      <span id="pageIndicator"></span>
      <button id="pageNext" type="button" aria-label="다음 페이지">›</button>
    </div>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-label="카드 상세">
    <button id="modalClose" class="modal-close" aria-label="닫기">×</button>
    <div class="modal-card-nav">
      <button id="prevCard" type="button" aria-label="이전 카드">‹ 이전 카드</button>
      <button id="nextCard" type="button" aria-label="다음 카드">다음 카드 ›</button>
    </div>
    <div class="detail-images">
      <div class="detail-pocket"><img id="detailFront" alt="앞면"></div>
      <div class="detail-pocket"><img id="detailBack" alt="뒷면"></div>
    </div>
    <div class="names">
      <div class="detail-title-row">
        <button id="detailWishlistHeart" class="detail-wishlist-heart" type="button" aria-label="위시리스트 체크" aria-pressed="false">♡</button>
        <div class="detail-title-text">
          <div id="detailKo" class="name-ko"></div>
          <div id="detailJa" class="name-ja"></div>
        </div>
        <div class="owned-stepper" aria-label="보유 카드 장수 조절">
          <button id="ownedMinus" type="button" aria-label="보유 장수 줄이기">−</button>
          <span><b id="ownedCountValue">0</b>장</span>
          <button id="ownedPlus" type="button" aria-label="보유 장수 늘리기">＋</button>
        </div>
      </div>
    </div>
    <div class="info">
      <div><span>ID</span> : <b id="detailId"></b><span class="gap"></span><span>등급</span> : <b id="detailGrade"></b></div>
      <div><span>타입</span> : <b id="detailType"></b></div>
      <div><span>카테고리</span> : <b id="detailCategory"></b></div>
      <div><span>구분</span> : <b id="detailSeason"></b></div>
    </div>
</div>
</div>

<div id="pageActionBar" class="page-action-bar" role="region" aria-label="카드 작업 선택">
  <div id="pageActionHint" class="page-action-hint">원하는 작업 버튼을 선택한 뒤 카드 이미지 또는 이름을 눌러주세요.</div>
  <div class="page-action-buttons">
    <button id="pageWishlistMode" type="button" aria-pressed="false">♡ 위시리스트 체크</button>
    <button id="pageOwnedMode" type="button" aria-pressed="false">＋ 보유 체크</button>
  </div>
</div>
<script src="script.js?v=coordinate-mode-20261010"></script>
</body>
</html>
